<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --nova-navy: #1d3557; --nova-sky: #7fb3e6; --nova-white: #ffffff; }
        
        @media (min-width: 1024px) {
            #zoom-wrapper { transform: scale(0.85); transform-origin: top center; width: 117.65%; margin-left: -8.825%; }
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--nova-white); color: var(--nova-navy); overflow-x: hidden; scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .slogan-font { font-family: 'Caveat', cursive; }
        .starry-bg { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); position: relative; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.3); } }
        
        .img-container { border-radius: 2.5rem; overflow: hidden; box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15); background-color: #f8fafc; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .img-container img, .img-container video { width: 100%; height: 100%; display: block; object-fit: cover; }
        
        .video-wrapper { max-width: 280px; width: 100%; margin: 0 auto; }
        video { border-radius: 1.5rem; width: 100%; height: auto; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: block; object-fit: contain; }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(29, 53, 87, 0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .view-transition { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .review-bubble { 
            min-width: 280px; 
            padding: 2.5rem; 
            border-radius: 3rem; 
            background: white; 
            border: 2px dashed #e2e8f0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            animation: float 6s infinite ease-in-out;
            animation-delay: var(--delay);
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

<!-- Custom Nova Modal -->
<div id="nova-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-6">
    <div class="glass-card max-w-sm w-full p-10 rounded-[3rem] text-center shadow-2xl border-2 border-[#7fb3e6]/30">
        <h2 class="text-3xl font-black text-[#1d3557] mb-2 uppercase italic tracking-tighter">Welcome to</h2>
        <h2 class="text-5xl font-black text-[#7fb3e6] mb-6 uppercase italic tracking-tighter">NGO NOVA</h2>
        <p class="slogan-font text-4xl text-[#1d3557] leading-tight mb-8">
            Help bring smiles <br> without barriers
        </p>
        <button onclick="closeNovaModal()" class="w-full bg-[#1d3557] text-white py-4 rounded-full font-black uppercase tracking-widest hover:bg-[#7fb3e6] transition-all shadow-lg">
            Let's Go!
        </button>
    </div>
</div>

<div id="zoom-wrapper">
    <nav class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 h-20 flex items-center justify-between px-6">
        <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-[#7fb3e6] shadow-sm bg-white">
                <img src="assets/images/logo.jpeg" class="w-full h-full object-cover">
            </div>
            <span class="ml-3 font-black text-[#1d3557] italic tracking-tighter text-xl uppercase">Team NOVA</span>
        </div>
        <div class="hidden lg:flex space-x-10 text-[16px] font-bold uppercase tracking-widest">
            <button onclick="navigateTo('home')" class="text-[#1d3557] hover:text-[#7fb3e6]">Home</button>
            <button onclick="navigateTo('events')" class="text-[#1d3557] hover:text-[#7fb3e6]">Events</button>
            <button onclick="navigateTo('reviews')" class="text-[#1d3557] hover:text-[#7fb3e6]">Write Review</button>
            <button onclick="navigateTo('contact')" class="text-[#7fb3e6]">Connect</button>
        </div>
    </nav>

    <main id="app-content" class="pt-20 min-h-screen"></main>

    <footer class="w-full py-20 bg-slate-100 border-t border-gray-200 text-center px-6">
        <div class="max-w-4xl mx-auto">
            <p class="text-gray-500 font-semibold text-lg leading-relaxed">
                Need help? Contact us at 
                <a href="https://ig.me/m/nova_.ngo" target="_blank" class="text-[#7fb3e6] font-extrabold underline">@nova_.ngo</a>
                for queries, collaborations or donations. <br>
                <span class="text-[#1d3557] font-black uppercase tracking-widest text-sm mt-6 block">Thank you.</span>
            </p>
        </div>
    </footer>
</div>

<script>
    const views = {
        home: () => `
            <section class="starry-bg text-white py-28 md:py-48 px-6 text-center relative overflow-hidden view-transition">
                <div id="home-stars"></div>
                <div class="relative z-10 max-w-5xl mx-auto">
                    <span class="inline-block px-5 py-1.5 border border-white/20 rounded-full text-[10px] font-bold tracking-[0.4em] mb-10 uppercase bg-white/5">Youth Led NGO</span>
                    <h1 class="text-6xl md:text-9xl font-extrabold mb-10 leading-[0.9] tracking-tighter uppercase">Small Acts, <br><span class="text-[#7fb3e6]">Big Smiles.</span></h1>
                    <p class="text-xl md:text-2xl text-blue-100 font-light max-w-3xl mx-auto leading-relaxed mb-12">Team Nova is a youth led NGO dedicated to spreading happiness through workshops and community action.</p>
                    <div class="flex justify-center gap-6">
                        <button onclick="navigateTo('events')" class="bg-white text-[#1d3557] px-10 py-4 rounded-full font-black text-sm uppercase tracking-widest shadow-xl hover:scale-105 transition-all">Past Events</button>
                    </div>
                </div>
            </section>
            <section class="py-32 bg-slate-50 px-6">
                <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                    <div class="order-2 md:order-1 text-left">
                        <h2 class="text-5xl font-extrabold text-[#7fb3e6] mb-8 uppercase tracking-tighter italic">TEAM NOVA</h2>
                        <p class="text-gray-600 text-lg leading-relaxed font-light">Through workshops, charity events, and community activities, we strive to bring support, hope, and joy to children and adults who struggle to make ends meet.</p>
                    </div>
                    <div class="order-1 md:order-2 img-container aspect-square"><img src="assets/images/about2.jpeg"></div>
                </div>
            </section>
        `,
        events: () => `
            <section class="starry-bg text-white py-24 text-center relative overflow-hidden view-transition">
                <div id="events-stars"></div>
                <h2 class="text-6xl font-extrabold mb-4 uppercase italic tracking-tighter">PAST EVENTS</h2>
            </section>
            <div class="max-w-7xl mx-auto py-24 px-6 grid md:grid-cols-3 gap-8">
                <div class="glass-card rounded-[3rem] overflow-hidden cursor-pointer" onclick="navigateTo('rotionwheels-detail')">
                     <div class="h-64 relative overflow-hidden bg-slate-900 flex items-center justify-center">
                        <video class="w-full h-full object-cover opacity-60" autoplay muted loop playsinline controls><source src="assets/videos/food1.mp4"></video>
                        <span class="absolute text-white text-xs font-bold uppercase tracking-widest bg-black/40 px-4 py-2 rounded-full">Roti on Wheels</span>
                     </div>
                     <div class="p-8 text-center"><h3 class="text-2xl font-black text-[#1d3557] uppercase">Nutrition</h3></div>
                </div>
                <div class="glass-card rounded-[3rem] overflow-hidden cursor-pointer" onclick="navigateTo('bookdrive-detail')">
                     <div class="h-64 relative overflow-hidden">
                        <img src="assets/images/bookdrive1.jpeg" class="w-full h-full object-cover">
                        <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-xs font-bold uppercase tracking-widest bg-black/40 px-4 py-2 rounded-full">The Book Drive</span>
                     </div>
                     <div class="p-8 text-center"><h3 class="text-2xl font-black text-[#1d3557] uppercase">Education</h3></div>
                </div>
                <div class="glass-card rounded-[3rem] overflow-hidden cursor-pointer" onclick="navigateTo('pickleball-detail')">
                     <div class="h-64 relative overflow-hidden">
                        <img src="assets/images/pickle1.jpeg" class="w-full h-full object-cover">
                        <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-xs font-bold uppercase tracking-widest bg-black/40 px-4 py-2 rounded-full">Pickleball</span>
                     </div>
                     <div class="p-8 text-center"><h3 class="text-2xl font-black text-[#1d3557] uppercase">Fundraiser</h3></div>
                </div>
            </div>
        `,
        'rotionwheels-detail': () => `
            <div class="view-transition pb-24">
                <div class="starry-bg py-24 md:py-32 px-6 text-white relative overflow-hidden">
                    <div id="roti-stars"></div>
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16 relative z-10">
                        <div class="md:w-1/2 text-left">
                            <button onclick="navigateTo('events')" class="text-white/70 font-black text-xs uppercase tracking-widest mb-12 flex items-center hover:-translate-x-2 transition-transform">← Back to Events</button>
                            <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter leading-none">ROTI ON <br><span class="text-[#7fb3e6]">WHEELS</span></h1>
                        </div>
                        <div class="md:w-1/2 flex flex-col gap-6 items-center">
                            <div class="video-wrapper"><video autoplay muted loop playsinline controls><source src="assets/videos/food1.mp4"></video></div>
                            <div class="video-wrapper"><video autoplay muted loop playsinline controls><source src="assets/videos/f4.mp4"></video></div>
                        </div>
                    </div>
                </div>
                <div class="max-w-5xl mx-auto py-24 px-6 text-center text-xl text-gray-600 font-light leading-relaxed space-y-8">
                    <p>Today was a truly impactful day as we brought "Roti on Wheels" to the busy streets near Ballygunge Station. We were able to serve over 300 people a wholesome, hot meal consisting of fresh rotis, nutritious sabji, tangy aachar, and a sweet treat of gulab jamun. It was a privilege to see the immediate difference a warm meal makes, providing both nourishment and a sense of community to everyone who visited the truck.</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pt-10">
                        <div class="img-container aspect-[3/4]"><img src="assets/images/f1.jpeg"></div>
                        <div class="img-container aspect-[3/4]"><img src="assets/images/f2.jpeg"></div>
                        <div class="img-container aspect-[3/4]"><img src="assets/images/f3.jpeg"></div>
                    </div>
                    <div class="slogan-font text-5xl text-[#7fb3e6] mt-20">Love, <br>nova.</div>
                </div>
            </div>
        `,
        'bookdrive-detail': () => `
            <div class="view-transition pb-24">
                <div class="starry-bg py-24 md:py-32 px-6 text-white relative overflow-hidden">
                    <div id="book-stars"></div>
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16 relative z-10">
                        <div class="md:w-1/2 text-left">
                            <button onclick="navigateTo('events')" class="text-white/70 font-black text-xs uppercase tracking-widest mb-12 flex items-center hover:-translate-x-2 transition-transform">← Back to Events</button>
                            <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter uppercase">Book <br><span class="text-[#7fb3e6]">Drive</span></h1>
                        </div>
                        <div class="md:w-1/2 flex flex-col gap-6 items-center">
                            <div class="video-wrapper"><video autoplay muted loop playsinline controls><source src="assets/videos/bookdrive3.mp4"></video></div>
                            <div class="video-wrapper"><video autoplay muted loop playsinline controls><source src="assets/videos/b2.mp4"></video></div>
                        </div>
                    </div>
                </div>
                <div class="max-w-5xl mx-auto py-24 px-6 text-center text-xl text-gray-600 font-light leading-relaxed space-y-8">
                    <p>There's something so special about books, we all have a favorite childhood memory linked to a book, whether it's fiction or a comic. Sadly, not every child gets the chance to experience that joy and make memories with pages.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-10">
                        <div class="img-container aspect-video"><img src="assets/images/b1.jpeg"></div>
                        <div class="img-container aspect-video"><img src="assets/images/b3.jpeg"></div>
                    </div>
                    <div class="slogan-font text-5xl text-[#7fb3e6] mt-20">Love, <br>nova.</div>
                </div>
            </div>
        `,
        'pickleball-detail': () => `
            <div class="view-transition pb-24">
                <div class="starry-bg py-24 md:py-32 px-6 text-white relative overflow-hidden">
                    <div id="pickle-stars"></div>
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16 relative z-10">
                        <div class="md:w-1/2 text-left">
                            <button onclick="navigateTo('events')" class="text-white/70 font-black text-xs uppercase tracking-widest mb-12 flex items-center hover:-translate-x-2 transition-transform">← Back to Events</button>
                            <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter">PICKLEBALL <br><span class="text-[#7fb3e6]">SMASH HIT</span></h1>
                        </div>
                        <div class="md:w-1/2 flex justify-center">
                            <div class="video-wrapper"><video autoplay muted loop playsinline controls><source src="assets/videos/pickle12.mp4"></video></div>
                        </div>
                    </div>
                </div>
                <div class="max-w-7xl mx-auto py-24 px-6 text-center text-xl text-gray-600 font-light leading-relaxed space-y-12">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <div class="img-container aspect-[4/5]"><img src="assets/images/pickle1.jpeg"></div>
                        <div class="img-container aspect-[4/5]"><video autoplay muted loop playsinline controls class="w-full h-full object-cover"><source src="assets/videos/pickle2.mp4"></video></div>
                        <div class="img-container aspect-[4/5]"><img src="assets/images/pickle3.jpeg"></div>
                    </div>
                    <div class="slogan-font text-5xl text-[#7fb3e6] mt-20">Love, <br>nova.</div>
                </div>
            </div>
        `
    };

    function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }
    function closeNovaModal() { document.getElementById('nova-modal').classList.add('hidden'); }

    function navigateTo(viewName) {
        const content = document.getElementById('app-content');
        content.innerHTML = views[viewName] ? views[viewName]() : views['home']();
        window.scrollTo({ top: 0, behavior: 'smooth' });

        if(viewName === 'home') {
            createStars('home-stars');
            if (!sessionStorage.getItem('visited')) {
                document.getElementById('nova-modal').classList.remove('hidden');
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#1d3557', '#7fb3e6', '#ffffff'],
                    zIndex: 200
                });
                sessionStorage.setItem('visited', 'true');
            }
        }
    }

    window.onload = () => navigateTo('home');
</script>
</body>
</html>
