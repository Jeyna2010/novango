<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --nova-navy: #1d3557; --nova-sky: #7fb3e6; --nova-white: #ffffff; }
        
        /* 90% Zoom Logic */
        html, body { 
            background-color: var(--nova-white); 
            margin: 0; 
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        #zoom-wrapper {
            transform: scale(0.90);
            transform-origin: top center;
            width: 111.11%; /* 1 / 0.90 to fill the width perfectly */
            margin-left: -5.55%; /* Centering the scaled content */
            min-height: 111.11vh;
        }

        body { font-family: 'Inter', sans-serif; color: var(--nova-navy); scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .slogan-font { font-family: 'Caveat', cursive; }
        
        .starry-bg { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); position: relative; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.3); } }
        
        .img-container { border-radius: 2.5rem; overflow: hidden; box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15); background-color: #000; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; display: block; object-fit: cover; }
        
        .video-wrapper { max-width: 400px; width: 100%; margin: 0 auto; }
        video { border-radius: 2rem; width: 100%; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: block; }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(29, 53, 87, 0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .qr-frame { max-width: 260px; margin: 0 auto; border: 10px solid white; border-radius: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; overflow: hidden; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
        .view-transition { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .star-rating { direction: rtl; display: inline-block; padding: 20px; }
        .star-rating input { display: none; }
        .star-rating label { color: #ccc; cursor: pointer; font-size: 35px; transition: 0.2s; }
        .star-rating label:hover, .star-rating label:hover ~ label, .star-rating input:checked ~ label { color: #f59e0b; }
    </style>
</head>
<body>

<div id="zoom-wrapper">
    <nav class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 h-24 flex items-center justify-between px-10">
        <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-[#7fb3e6] shadow-sm bg-white">
                <img src="assets/images/logo.jpeg" class="w-full h-full object-cover">
            </div>
            <span class="ml-4 font-black text-[#1d3557] italic tracking-tighter text-2xl uppercase">Team NOVA</span>
        </div>
        
        <!-- TASKBAR TEXT: Increased to text-[18px] to counter the zoom-out -->
        <div class="hidden lg:flex space-x-12 text-[18px] font-bold uppercase tracking-[0.15em]">
            <button onclick="navigateTo('home')" class="text-[#1d3557] hover:text-[#7fb3e6] transition-colors">Home</button>
            <button onclick="navigateTo('events')" class="text-[#1d3557] hover:text-[#7fb3e6] transition-colors">Events</button>
            <button onclick="navigateTo('reviews')" class="text-[#1d3557] hover:text-[#7fb3e6] transition-colors">Write Review</button>
            <button onclick="navigateTo('contact')" class="text-[#7fb3e6] hover:opacity-80 transition-opacity">Connect</button>
        </div>

        <button class="lg:hidden text-[#1d3557]" onclick="toggleMobileMenu()">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
        <div id="mobile-menu" class="hidden absolute top-24 left-0 w-full bg-white border-b border-gray-100 p-8 flex flex-col space-y-6 lg:hidden shadow-lg">
            <button onclick="navigateTo('home')" class="text-left font-bold text-lg uppercase">Home</button>
            <button onclick="navigateTo('events')" class="text-left font-bold text-lg uppercase">Events</button>
            <button onclick="navigateTo('reviews')" class="text-left font-bold text-lg uppercase">Write Review</button>
            <button onclick="navigateTo('contact')" class="text-left font-bold text-lg uppercase text-[#7fb3e6]">Connect</button>
        </div>
    </nav>

    <main id="app-content" class="pt-24 min-h-screen"></main>
</div>

<script>
    const views = {
        home: () => `
            <section class="starry-bg text-white py-28 md:py-48 px-6 text-center relative overflow-hidden view-transition">
                <div id="home-stars"></div>
                <div class="relative z-10 max-w-5xl mx-auto">
                    <span class="inline-block px-5 py-1.5 border border-white/20 rounded-full text-[10px] font-bold tracking-[0.4em] mb-10 uppercase bg-white/5">Youth Led NGO</span>
                    <h1 class="text-6xl md:text-9xl font-extrabold mb-10 leading-[0.9] tracking-tighter uppercase">Small Acts, <br><span class="text-[#7fb3e6]">Big Smiles.</span></h1>
                    <p class="text-xl md:text-2xl text-blue-100 font-light max-w-3xl mx-auto leading-relaxed mb-12">Team Nova is a youth led NGO dedicated to spreading happiness through workshops and community action.</p>
                    <div class="flex justify-center gap-6">
                        <button onclick="navigateTo('events')" class="bg-white text-[#1d3557] px-12 py-5 rounded-full font-black text-sm uppercase tracking-widest shadow-xl hover:scale-105 transition-all">Past Events</button>
                    </div>
                </div>
            </section>
            <section class="py-32 bg-slate-50 px-6">
                <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                    <div class="order-2 md:order-1 text-left">
                        <h2 class="text-5xl font-extrabold text-[#7fb3e6] mb-8 uppercase tracking-tighter italic">TEAM NOVA</h2>
                        <p class="text-gray-600 text-lg leading-relaxed font-light">Through workshops, charity events, and community activities, we strive to bring support, hope, and joy to children and adults who struggle to make ends meet.</p>
                    </div>
                    <div class="order-1 md:order-2 img-container aspect-square"><img src="assets/images/about2.jpeg"></div>
                </div>
            </section>
            <section class="py-32 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                <div class="img-container aspect-square"><img src="assets/images/about.jpeg"></div>
                <div class="text-left">
                    <h2 class="text-6xl font-black text-[#1d3557] mb-8 uppercase italic tracking-tighter">OUR AIM</h2>
                    <p class="text-gray-600 text-xl font-light leading-relaxed mb-10">Team Nova is a non-profit NGO led by youth with the simple goal of spreading happiness even in the smallest of ways.</p>
                    <div class="bg-blue-50/50 p-10 rounded-[3rem] border-l-[12px] border-[#7fb3e6] shadow-sm">
                        <h3 class="slogan-font text-5xl text-[#1d3557] leading-snug">"to bring smiles, beyond social, religious and economic barriers"</h3>
                    </div>
                </div>
            </section>
        `,
        events: () => `
            <section class="starry-bg text-white py-24 text-center relative overflow-hidden view-transition">
                <div id="events-stars"></div>
                <h2 class="text-6xl font-extrabold mb-4 uppercase italic tracking-tighter">PAST EVENTS</h2>
            </section>
            <div class="max-w-7xl mx-auto py-24 px-6 grid md:grid-cols-3 gap-8">
                <div class="glass-card rounded-[3rem] overflow-hidden cursor-pointer" onclick="navigateTo('rotionwheels-detail')">
                     <div class="h-64 relative overflow-hidden bg-slate-900 flex items-center justify-center">
                        <video class="w-full h-full object-cover opacity-60" muted loop playsinline onmouseover="this.play()"><source src="assets/videos/food1.mp4"></video>
                        <span class="absolute text-white text-xs font-bold uppercase tracking-widest bg-black/40 px-4 py-2 rounded-full">Roti on Wheels</span>
                     </div>
                     <div class="p-8 text-center"><h3 class="text-2xl font-black text-[#1d3557] uppercase">Nutrition</h3></div>
                </div>
                <div class="glass-card rounded-[3rem] overflow-hidden cursor-pointer" onclick="navigateTo('bookdrive-detail')">
                     <div class="h-64 relative overflow-hidden">
                        <img src="assets/images/bookdrive1.jpeg" class="w-full h-full object-cover">
                        <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-xs font-bold uppercase tracking-widest bg-black/40 px-4 py-2 rounded-full">The Book Drive</span>
                     </div>
                     <div class="p-8 text-center"><h3 class="text-2xl font-black text-[#1d3557] uppercase">Education</h3></div>
                </div>
                <div class="glass-card rounded-[3rem] overflow-hidden cursor-pointer" onclick="navigateTo('pickleball-detail')">
                     <div class="h-64 relative overflow-hidden">
                        <img src="assets/images/pickle1.jpeg" class="w-full h-full object-cover">
                        <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-xs font-bold uppercase tracking-widest bg-black/40 px-4 py-2 rounded-full">Pickleball</span>
                     </div>
                     <div class="p-8 text-center"><h3 class="text-2xl font-black text-[#1d3557] uppercase">Fundraiser</h3></div>
                </div>
            </div>
        `,
        'rotionwheels-detail': () => `
            <div class="view-transition pb-24">
                <div class="starry-bg py-24 md:py-32 px-6 text-white relative overflow-hidden">
                    <div id="roti-stars"></div>
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16 relative z-10">
                        <div class="md:w-1/2 text-left">
                            <button onclick="navigateTo('events')" class="text-white/70 font-black text-xs uppercase tracking-widest mb-12 flex items-center hover:-translate-x-2 transition-transform">← Back to Events</button>
                            <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter leading-none">ROTI ON <br><span class="text-[#7fb3e6]">WHEELS</span></h1>
                            <p class="text-2xl text-blue-100/70 font-light italic">"Serving over 300 wholesome meals"</p>
                        </div>
                        <div class="md:w-1/2 flex flex-col gap-6">
                            <div class="video-wrapper"><video controls><source src="assets/videos/food1.mp4"></video></div>
                            <div class="video-wrapper"><video controls><source src="assets/videos/f4.mp4"></video></div>
                        </div>
                    </div>
                </div>
                <div class="max-w-6xl mx-auto py-24 px-6 text-xl text-gray-600 font-light leading-relaxed space-y-8">
                    <p>Today was a truly impactful day as we brought "Roti on Wheels" to the busy streets near Ballygunge Station. We were able to serve over 300 people a wholesome, hot meal consisting of fresh rotis, nutritious sabji, tangy aachar, and a sweet treat of gulab jamun.</p>
                    <p>This event was a collaboration between NGO Nova and the Santosh Lalita Jain Foundation (SLJF). While the specialized mobile food truck is an initiative of the SLJF, NGO Nova took the lead in sponsoring and facilitating the entire food service for the day.</p>
                    <div class="slogan-font text-5xl text-[#7fb3e6] text-center mt-12">Love, <br>nova.</div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-20">
                        <div class="img-container aspect-[3/4]"><img src="assets/images/f1.jpeg"></div>
                        <div class="img-container aspect-[3/4]"><img src="assets/images/f2.jpeg"></div>
                        <div class="img-container aspect-[3/4]"><img src="assets/images/f3.jpeg"></div>
                    </div>
                </div>
            </div>
        `,
        'bookdrive-detail': () => `
            <div class="view-transition pb-24">
                <div class="starry-bg py-24 md:py-32 px-6 text-white relative overflow-hidden">
                    <div id="book-stars"></div>
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16 relative z-10">
                        <div class="md:w-1/2 text-left">
                            <button onclick="navigateTo('events')" class="text-white/70 font-black text-xs uppercase tracking-widest mb-12 flex items-center hover:-translate-x-2 transition-transform">← Back to Events</button>
                            <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter uppercase">Book <br><span class="text-[#7fb3e6]">Drive</span></h1>
                            <p class="text-2xl text-blue-100/70 font-light italic">"For the kids who want to read but can not"</p>
                        </div>
                        <div class="md:w-1/2 flex flex-col gap-6">
                            <div class="video-wrapper"><video controls><source src="assets/videos/bookdrive3.mp4"></video></div>
                            <div class="video-wrapper"><video controls><source src="assets/videos/b2.mp4"></video></div>
                        </div>
                    </div>
                </div>
                <div class="max-w-4xl mx-auto py-24 px-6 text-xl text-gray-600 font-light leading-relaxed space-y-8">
                    <p>There's something so special about books. Sadly, not every child gets the chance to experience that joy. That's why Team Nova hosted our very first Book Drive. We collected donations from 29th September to 1st October 2025.</p>
                    <p>Grateful for every heart that joined us! Thank you CINI (Child in Need Institute) for letting us be a part of such a wonderful experience.</p>
                    <div class="slogan-font text-5xl text-[#7fb3e6] text-center mt-12">Love, <br>nova.</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-20">
                        <div class="img-container aspect-video"><img src="assets/images/b1.jpeg"></div>
                        <div class="img-container aspect-video"><img src="assets/images/b3.jpeg"></div>
                    </div>
                </div>
            </div>
        `,
        'pickleball-detail': () => `
            <div class="view-transition pb-24">
                <div class="starry-bg py-24 md:py-32 px-6 text-white relative overflow-hidden">
                    <div id="pickle-stars"></div>
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16 relative z-10">
                        <div class="md:w-1/2 text-left">
                            <button onclick="navigateTo('events')" class="text-white/70 font-black text-xs uppercase tracking-widest mb-12 flex items-center hover:-translate-x-2 transition-transform">← Back to Events</button>
                            <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter">PICKLEBALL <br><span class="text-[#7fb3e6]">SMASH HIT</span></h1>
                            <p class="text-2xl text-blue-100/70 font-light italic">Bringing smiles without barriers.</p>
                        </div>
                        <div class="md:w-1/2 img-container aspect-[4/5] scale-105"><img src="assets/images/pickle1.jpeg"></div>
                    </div>
                </div>
                <div class="max-w-7xl mx-auto py-24 px-6 text-center">
                    <div class="max-w-3xl mx-auto space-y-8 text-2xl text-gray-600 font-light leading-relaxed mb-20">
                        <p>Ngo nova had its first fundraiser! A pickleball smash hit fundraiser with all proceeds going to funding our future drives. The winners walked away with 10k and an amazing experience.</p>
                    </div>
                    <h3 class="text-5xl font-black text-[#1d3557] mb-20 uppercase tracking-tighter italic">EVENT GALLERY</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="img-container aspect-[4/5]"><img src="assets/images/pickle8.jpeg"></div>
                        <div class="img-container aspect-[4/5]"><img src="assets/images/pickle9.jpeg"></div>
                        <div class="img-container aspect-[4/5]"><img src="assets/images/pickle10.jpeg"></div>
                        <div class="img-container aspect-[4/5]"><img src="assets/images/pickle11.jpeg"></div>
                        <div class="img-container aspect-[4/5]"><img src="assets/images/pickle3.jpeg"></div>
                        <div class="bg-black rounded-[2.5rem] overflow-hidden p-2 aspect-[9/16]"><video controls class="h-full w-full object-cover"><source src="assets/videos/pickle12.mp4"></video></div>
                    </div>
                    <div class="slogan-font text-5xl text-[#7fb3e6] mt-12">Love, <br>nova.</div>
                </div>
            </div>
        `,
        reviews: () => `
            <div class="max-w-4xl mx-auto py-24 px-6 view-transition text-center">
                <h2 class="text-6xl font-black text-[#1d3557] mb-10 uppercase italic">WRITE A REVIEW</h2>
                <div class="glass-card p-10 rounded-[3rem] shadow-xl text-left">
                    <form onsubmit="event.preventDefault(); alert('Thank you for your review!'); navigateTo('home');">
                        <div class="flex justify-center mb-8">
                            <div class="star-rating">
                                <input type="radio" id="star5" name="rating" value="5"/><label for="star5">★</label>
                                <input type="radio" id="star4" name="rating" value="4"/><label for="star4">★</label>
                                <input type="radio" id="star3" name="rating" value="3"/><label for="star3">★</label>
                                <input type="radio" id="star2" name="rating" value="2"/><label for="star2">★</label>
                                <input type="radio" id="star1" name="rating" value="1"/><label for="star1">★</label>
                            </div>
                        </div>
                        <div class="space-y-6">
                            <div>
                                <label class="block text-sm font-bold mb-2">Display Name</label>
                                <div class="flex gap-4 mb-3">
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="id" checked onclick="document.getElementById('ni').disabled=0" class="mr-2"> Name</label>
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="id" onclick="document.getElementById('ni').disabled=1;document.getElementById('ni').value=''" class="mr-2"> Anonymous</label>
                                </div>
                                <input type="text" id="ni" placeholder="Your Name" class="w-full p-4 rounded-2xl border border-gray-200 focus:outline-[#7fb3e6]">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2">Comment</label>
                                <textarea class="w-full p-4 rounded-2xl border border-gray-200 h-32 focus:outline-[#7fb3e6]" required placeholder="Share your experience..."></textarea>
                            </div>
                            <button type="submit" class="w-full bg-[#1d3557] text-white py-5 rounded-full font-black uppercase tracking-widest hover:bg-[#7fb3e6] transition-all">Post Review</button>
                        </div>
                    </form>
                </div>
            </div>
        `,
        contact: () => `
            <div class="max-w-3xl mx-auto py-32 text-center px-6 view-transition">
                <h2 class="text-6xl font-black text-[#1d3557] mb-6 uppercase italic tracking-tighter">CONNECT</h2>
                <p class="text-xl font-bold mb-10 text-[#1d3557]">teamnova.kolkata@gmail.com</p>
                <div class="qr-frame mb-12"><img src="assets/images/about3.jpeg"></div>
                <a href="https://ig.me/m/nova_.ngo" target="_blank" class="bg-[#1d3557] text-white px-16 py-5 rounded-full font-black uppercase shadow-xl hover:scale-105 transition-all">MESSAGE US ON INSTAGRAM</a>
                <p class="mt-16 slogan-font text-4xl text-[#7fb3e6]">Love, nova.</p>
            </div>
        `
    };

    function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('hidden'); }

    function navigateTo(viewName) {
        document.getElementById('app-content').innerHTML = views[viewName] ? views[viewName]() : views['home']();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById('mobile-menu').classList.add('hidden');
        if(viewName === 'home') createStars('home-stars');
        if(viewName === 'events') createStars('events-stars');
        if(viewName === 'rotionwheels-detail') createStars('roti-stars');
        if(viewName === 'bookdrive-detail') createStars('book-stars');
        if(viewName === 'pickleball-detail') createStars('pickle-stars');
    }

    function createStars(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = (Math.random() * 2 + 1) + 'px';
            star.style.width = size; star.style.height = size;
            star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }
    }

    window.onload = () => {
        navigateTo('home');
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#1d3557', '#7fb3e6', '#ffffff'] });
    };
</script>
</body>
</html>
