<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --nova-navy: #1d3557; --nova-sky: #7fb3e6; --nova-white: #ffffff; }
        
        @media (min-width: 1024px) {
            #zoom-wrapper { transform: scale(0.85); transform-origin: top center; width: 117.65%; margin-left: -8.825%; }
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--nova-white); color: var(--nova-navy); overflow-x: hidden; scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .slogan-font { font-family: 'Caveat', cursive; }
        .starry-bg { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); position: relative; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.3); } }
        
        .img-container { border-radius: 2.5rem; overflow: hidden; box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15); background-color: #000; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .img-container img { width: 100%; height: 100%; display: block; object-fit: cover; }
        
        .video-wrapper { max-width: 280px; width: 100%; margin: 0 auto; }
        video { border-radius: 1.5rem; width: 100%; height: auto; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: block; object-fit: contain; }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(29, 53, 87, 0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .view-transition { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .star-rating { direction: rtl; display: inline-flex; gap: 5px; }
        .star-rating input { display: none; }
        .star-rating label { color: #ccc; cursor: pointer; font-size: 40px; transition: 0.2s; }
        .star-rating label:hover, .star-rating label:hover ~ label, .star-rating input:checked ~ label { color: #f59e0b; }

        .review-bubble { 
            min-width: 280px; 
            padding: 2.5rem; 
            border-radius: 3rem; 
            background: white; 
            border: 2px dashed #e2e8f0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            animation: float 6s infinite ease-in-out;
            animation-delay: var(--delay);
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

<div id="nova-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-6">
    <div class="glass-card max-w-sm w-full p-10 rounded-[3rem] text-center shadow-2xl border-2 border-[#7fb3e6]/30">
        <h2 class="text-3xl font-black text-[#1d3557] mb-2 uppercase italic tracking-tighter">Welcome to</h2>
        <h2 class="text-5xl font-black text-[#7fb3e6] mb-6 uppercase italic tracking-tighter">NGO NOVA</h2>
        <p class="slogan-font text-4xl text-[#1d3557] leading-tight mb-8">Help bring smiles <br> without barriers</p>
        <button onclick="closeNovaModal()" class="w-full bg-[#1d3557] text-white py-4 rounded-full font-black uppercase tracking-widest hover:bg-[#7fb3e6] transition-all shadow-lg">Let's Go!</button>
    </div>
</div>

<div id="zoom-wrapper">
    <nav class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 h-20 flex items-center justify-between px-6">
        <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-[#7fb3e6] shadow-sm bg-white">
                <img src="assets/images/logo.jpeg" class="w-full h-full object-cover">
            </div>
            <span class="ml-3 font-black text-[#1d3557] italic tracking-tighter text-xl uppercase">Team NOVA</span>
        </div>
        <div class="hidden lg:flex space-x-10 text-[16px] font-bold uppercase tracking-widest">
            <button onclick="navigateTo('home')" class="nav-link text-[#1d3557] hover:text-[#7fb3e6]">Home</button>
            <button onclick="navigateTo('events')" class="nav-link text-[#1d3557] hover:text-[#7fb3e6]">Events</button>
            <button onclick="navigateTo('reviews')" class="nav-link text-[#1d3557] hover:text-[#7fb3e6]">Write Review</button>
            <button onclick="navigateTo('contact')" class="nav-link text-[#7fb3e6]">Connect</button>
        </div>
    </nav>

    <main id="app-content" class="pt-20 min-h-screen"></main>

    <footer class="w-full py-20 bg-slate-100 border-t border-gray-200 text-center px-6">
        <div class="max-w-4xl mx-auto">
            <p class="text-gray-500 font-semibold text-lg leading-relaxed">Need help? Contact us at <a href="https://ig.me/m/nova_.ngo" target="_blank" class="text-[#7fb3e6] font-extrabold underline">@nova_.ngo</a></p>
        </div>
    </footer>
</div>

<script>
    const views = {
        home: () => `
            <section class="starry-bg text-white py-28 md:py-48 px-6 text-center relative overflow-hidden view-transition">
                <div id="home-stars"></div>
                <div class="relative z-10 max-w-5xl mx-auto">
                    <h1 class="text-6xl md:text-9xl font-extrabold mb-10 leading-[0.9] tracking-tighter uppercase">Small Acts, <br><span class="text-[#7fb3e6]">Big Smiles.</span></h1>
                    <button onclick="navigateTo('events')" class="bg-white text-[#1d3557] px-10 py-4 rounded-full font-black text-sm uppercase tracking-widest shadow-xl hover:scale-105 transition-all">Past Events</button>
                </div>
            </section>
            <section class="py-32 bg-slate-50 px-6">
                <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                    <div class="text-left"><h2 class="text-5xl font-extrabold text-[#7fb3e6] mb-8 uppercase italic">TEAM NOVA</h2><p class="text-gray-600 text-lg">Youth-led NGO spreading hope and joy.</p></div>
                    <div class="img-container aspect-square"><img src="assets/images/about2.jpeg"></div>
                </div>
            </section>
        `,
        events: () => `
            <section class="starry-bg text-white py-24 text-center relative overflow-hidden view-transition">
                <div id="events-stars"></div>
                <h2 class="text-6xl font-extrabold uppercase italic tracking-tighter">PAST EVENTS</h2>
            </section>
            <div class="max-w-7xl mx-auto py-24 px-6 grid md:grid-cols-3 gap-8">
                <div class="glass-card rounded-[3rem] p-8 text-center cursor-pointer" onclick="navigateTo('rotionwheels-detail')">
                    <h3 class="text-2xl font-black text-[#1d3557] uppercase">Roti on Wheels</h3>
                </div>
            </div>
        `,
        reviews: () => `<div class="max-w-4xl mx-auto py-24 px-6 text-center view-transition"><h2 class="text-6xl font-black text-[#1d3557]">WRITE A REVIEW</h2></div>`,
        contact: () => `<div class="max-w-3xl mx-auto py-32 text-center px-6 view-transition"><h2 class="text-6xl font-black text-[#1d3557]">CONNECT</h2></div>`
    };

    function closeNovaModal() { document.getElementById('nova-modal').classList.add('hidden'); }

    function navigateTo(viewName, isFirstLoad = false) {
        const content = document.getElementById('app-content');
        content.innerHTML = views[viewName] ? views[viewName]() : views['home']();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        // Change the URL without reloading the page
        if (!isFirstLoad) window.history.pushState({view: viewName}, "", `#${viewName}`);

        if(viewName === 'home') {
            createStars('home-stars');
            
            // CHECK: Only show confetti/modal if it's the very first time in this session
            if (!sessionStorage.getItem('hasSeenWelcome')) {
                document.getElementById('nova-modal').classList.remove('hidden');
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#1d3557', '#7fb3e6', '#ffffff'],
                    zIndex: 200
                });
                sessionStorage.setItem('hasSeenWelcome', 'true');
            }
        }
        if(viewName === 'events') createStars('events-stars');
    }

    // Handle Back/Forward browser buttons
    window.onpopstate = (event) => {
        if (event.state && event.state.view) navigateTo(event.state.view, true);
    };

    function createStars(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
            container.appendChild(star);
        }
    }

    // On page load, check the URL hash to see which "page" to show
    window.onload = () => {
        const hash = window.location.hash.replace('#', '') || 'home';
        navigateTo(hash, true);
    };
</script>
</body>
</html>
