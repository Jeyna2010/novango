<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --nova-navy: #1d3557; --nova-sky: #7fb3e6; --nova-white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--nova-white); color: var(--nova-navy); overflow-x: hidden; scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .slogan-font { font-family: 'Caveat', cursive; }
        .starry-bg { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); position: relative; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.3); } }
        .img-container { border-radius: 2.5rem; overflow: hidden; box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15); background-color: #f8fafc; border: 1px solid rgba(0,0,0,0.05); }
        .img-container img { width: 100%; height: auto; display: block; object-fit: cover; }
        video { border-radius: 2rem; width: 100%; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .view-transition { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
                <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-[#7fb3e6] shadow-sm bg-white">
                    <img src="assets/images/image_1dae43.jpg" alt="Logo" class="w-full h-full object-cover">
                </div>
                <span class="ml-3 font-black text-[#1d3557] italic tracking-tighter text-xl uppercase">Team NOVA</span>
            </div>
            <div class="hidden lg:flex items-center space-x-10">
                <button onclick="navigateTo('home')" class="text-xs font-bold uppercase tracking-widest">Home</button>
                <button onclick="navigateTo('events')" class="text-xs font-bold uppercase tracking-widest">Events</button>
                <button onclick="navigateTo('contact')" class="text-xs font-bold uppercase tracking-widest text-[#7fb3e6]">Connect</button>
            </div>
        </div>
    </nav>

    <main id="app-content" class="pt-20 min-h-screen"></main>

    <script>
        const views = {
            home: () => `
                <section class="starry-bg text-white py-32 text-center relative">
                    <div id="home-stars"></div>
                    <div class="relative z-10 max-w-5xl mx-auto px-6">
                        <h1 class="text-7xl md:text-9xl font-extrabold mb-10 leading-[0.9] tracking-tighter">Small Acts, <br><span class="text-[#7fb3e6]">Big Smiles.</span></h1>
                        <p class="text-xl md:text-2xl text-blue-100 font-light max-w-3xl mx-auto mb-14">Youth-led NGO dedicated to spreading happiness beyond barriers.</p>
                        <button onclick="navigateTo('events')" class="bg-white text-[#1d3557] px-12 py-5 rounded-full font-black text-xs uppercase tracking-widest hover:scale-105 transition-transform">Past Events</button>
                    </div>
                </section>

                <section class="py-32 bg-slate-50 px-6">
                    <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                        <div class="order-2 md:order-1">
                            <h2 class="text-5xl font-extrabold text-[#1d3557] mb-8 uppercase italic text-[#7fb3e6]">TEAM NOVA</h2>
                            <p class="text-gray-600 text-lg leading-relaxed mb-10 font-light">Through workshops, charity events, and community activities, we strive to bring support, hope, and joy to children and adults who struggle to make ends meet.</p>
                        </div>
                        <div class="order-1 md:order-2 img-container">
                            <img src="assets/images/image_1d9f7b.png" alt="Team Nova">
                        </div>
                    </div>
                </section>

                <section class="py-32 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                    <div class="img-container">
                        <img src="assets/images/image_1daed6.png" alt="Our Aim">
                    </div>
                    <div>
                        <h2 class="text-5xl font-extrabold text-[#1d3557] mb-8 uppercase italic">OUR AIM</h2>
                        <p class="text-gray-600 text-xl leading-relaxed mb-8 font-light">Team Nova is a non-profit NGO led by youth with the simple goal of spreading happiness to the less fortunate, even in the smallest of ways.</p>
                        <div class="bg-blue-50/50 p-10 rounded-[3rem] border-l-[12px] border-[#7fb3e6]">
                            <h3 class="slogan-font text-5xl text-[#1d3557]">"to bring smiles, beyond social, religious and economic barriers"</h3>
                        </div>
                    </div>
                </section>
            `,
            'rotionwheels-detail': () => `
                <div class="view-transition pb-24">
                    <div class="bg-amber-50/50 py-24 px-6">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16">
                            <div class="md:w-1/2">
                                <h1 class="text-6xl md:text-8xl font-black text-[#1d3557] mb-8 italic uppercase tracking-tighter">ROTI ON <br><span class="text-amber-500">WHEELS</span></h1>
                                <p class="text-2xl text-gray-600 font-light italic mb-10">"Serving over 300 wholesome meals near Ballygunge Station"</p>
                            </div>
                            <div class="md:w-1/2">
                                <video controls class="shadow-2xl"><source src="assets/videos/image_1d4ca4.png" type="video/mp4"></video>
                            </div>
                        </div>
                    </div>
                    <div class="max-w-4xl mx-auto py-24 px-6 text-xl text-gray-600 space-y-8 font-light leading-relaxed">
                        <p>Today was a truly impactful day as we brought "Roti on Wheels" to the busy streets near Ballygunge Station. We were able to serve over 300 people a wholesome, hot meal consisting of fresh rotis, nutritious sabji, tangy aachar, and a sweet treat of gulab jamun.</p>
                        <p>This event was a collaboration between NGO Nova and the Santosh Lalita Jain Foundation (SLJ). While the specialized mobile food truck is an initiative of the SLJF, NGO Nova took the lead in sponsoring and facilitating the entire food service for the day.</p>
                        <div class="slogan-font text-5xl text-[#7fb3e6] mt-12">Love, nova.</div>
                    </div>
                </div>
            `,
            'bookdrive-detail': () => `
                <div class="view-transition pb-24">
                    <div class="bg-blue-50/50 py-24 px-6">
                        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                            <div class="bg-black rounded-[2.5rem] overflow-hidden p-2 shadow-2xl">
                                <video controls poster="assets/images/image_1d9ebc.jpg"><source src="assets/videos/image_1d9ebc.jpg" type="video/mp4"></video>
                            </div>
                            <div class="img-container aspect-[3/4]">
                                <img src="assets/images/image_1d9ebc.jpg" alt="Book Drive Poster" class="w-full h-full object-cover object-top">
                            </div>
                        </div>
                    </div>
                    <div class="max-w-4xl mx-auto py-24 px-6 text-xl text-gray-600 space-y-8 font-light">
                        <p>There's something so special about books... Sadly, not every child gets the chance to experience that joy. That's why Team Nova hosted our very first Book Drive from 29th Sept to 1st Oct 2025.</p>
                        <p>Grateful for every book and heart that joined us! Thank you CINI (Child in Need Institute) for letting us be a part of such a wonderful experience.</p>
                        <div class="slogan-font text-5xl text-[#7fb3e6]">Love, nova.</div>
                    </div>
                </div>
            `,
            'pickleball-detail': () => `
                <div class="view-transition pb-24">
                    <div class="bg-[#1d3557] py-24 px-6 text-white text-center">
                        <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter">PICKLEBALL <br><span class="text-[#7fb3e6]">SMASH HIT</span></h1>
                        <p class="max-w-2xl mx-auto text-xl text-blue-100 font-light">The winners walked away with 10k and an amazing experience. Each match was a war of talent!</p>
                    </div>
                    <div class="max-w-7xl mx-auto py-24 px-6">
                         <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-12">
                            <div class="img-container"><img src="assets/images/pickle8.jpeg" alt="Winners"></div>
                            <div class="img-container"><img src="assets/images/pickle9.jpeg" alt="Runners Up"></div>
                            <div class="img-container"><img src="assets/images/pickle10.jpeg" alt="Players"></div>
                            <div class="img-container"><img src="assets/images/pickle11.jpeg" alt="Team"></div>
                            <div class="img-container"><img src="assets/images/pickle3.jpeg" alt="The Court"></div>
                            <div class="bg-black rounded-[2.5rem] overflow-hidden p-2 aspect-[9/16]">
                                <video controls><source src="assets/videos/pickle12.mp4" type="video/mp4"></video>
                            </div>
                        </div>
                        <div class="text-center slogan-font text-5xl text-[#7fb3e6]">Love, nova.</div>
                    </div>
                </div>
            `,
            events: () => `
                <div class="max-w-7xl mx-auto py-24 px-6 text-center">
                    <h2 class="text-6xl font-black text-[#1d3557] mb-20 uppercase italic tracking-tighter">PAST EVENTS</h2>
                    <div class="grid md:grid-cols-3 gap-12">
                        <div onclick="navigateTo('rotionwheels-detail')" class="glass-card rounded-[3rem] p-4 cursor-pointer">
                             <div class="h-64 bg-slate-100 rounded-[2rem] overflow-hidden mb-6">
                                <video muted loop playsinline class="w-full h-full object-cover opacity-80" onmouseover="this.play()" onmouseout="this.pause()">
                                    <source src="assets/videos/image_1d4ca4.png" type="video/mp4">
                                </video>
                             </div>
                             <h3 class="text-2xl font-black uppercase">Roti on Wheels</h3>
                        </div>
                        <div onclick="navigateTo('bookdrive-detail')" class="glass-card rounded-[3rem] p-4 cursor-pointer">
                             <div class="h-64 bg-slate-100 rounded-[2rem] overflow-hidden mb-6">
                                <img src="assets/images/image_1d9ebc.jpg" class="w-full h-full object-cover">
                             </div>
                             <h3 class="text-2xl font-black uppercase">Book Drive</h3>
                        </div>
                        <div onclick="navigateTo('pickleball-detail')" class="glass-card rounded-[3rem] p-4 cursor-pointer">
                             <div class="h-64 bg-slate-100 rounded-[2rem] overflow-hidden mb-6">
                                <img src="assets/images/pickle1.jpeg" class="w-full h-full object-cover">
                             </div>
                             <h3 class="text-2xl font-black uppercase">Pickleball Fundraiser</h3>
                        </div>
                    </div>
                </div>
            `,
            contact: () => `
                <div class="max-w-3xl mx-auto py-32 px-6 text-center view-transition">
                    <h2 class="text-6xl font-black text-[#1d3557] mb-10 uppercase italic tracking-tighter">CONNECT</h2>
                    <div class="qr-container bg-white p-4 shadow-2xl rounded-[3rem]">
                        <img src="assets/images/about3.jpeg" alt="QR Code" class="w-full">
                    </div>
                    <p class="mt-12 text-gray-500 slogan-font text-3xl">bring smiles, beyond barriers</p>
                </div>
            `,
            upcoming: () => `
                <div class="py-32 text-center">
                    <h2 class="text-5xl font-black italic mb-6">COMING SOON</h2>
                    <p class="text-gray-400 italic slogan-font text-3xl">More acts of love in the works...</p>
                </div>
            `
        };

        function navigateTo(viewName) {
            const content = document.getElementById('app-content');
            content.innerHTML = views[viewName]();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(viewName === 'home') createStars('home-stars');
        }

        function createStars(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = (Math.random() * 2 + 1) + 'px';
                star.style.width = size; star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                container.appendChild(star);
            }
        }
        window.onload = () => navigateTo('home');
    </script>
</body>
</html>
