<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --nova-navy: #1d3557; --nova-sky: #7fb3e6; --nova-white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--nova-white); color: var(--nova-navy); overflow-x: hidden; scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .slogan-font { font-family: 'Caveat', cursive; }
        .starry-bg { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); position: relative; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.3); } }
        .img-container { border-radius: 2.5rem; overflow: hidden; box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15); background-color: #000; display: flex; align-items: center; justify-content: center; }
        .img-container img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(29, 53, 87, 0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .qr-frame { max-width: 260px; margin: 0 auto; border: 10px solid white; border-radius: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; overflow: hidden; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
        .qr-frame img { width: 115%; height: 115%; object-fit: cover; }
        .view-transition { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .star-rating { direction: rtl; display: inline-block; padding: 20px; }
        .star-rating input { display: none; }
        .star-rating label { color: #ccc; cursor: pointer; font-size: 30px; transition: all 0.2s ease-in-out; }
        .star-rating label:hover, .star-rating label:hover ~ label, .star-rating input:checked ~ label { color: #f59e0b; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 h-20 flex items-center justify-between px-6">
        <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
            <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-[#7fb3e6] shadow-sm bg-white">
                <img src="assets/images/logo.jpeg" class="w-full h-full object-cover">
            </div>
            <span class="ml-3 font-black text-[#1d3557] italic tracking-tighter text-xl uppercase">Team NOVA</span>
        </div>
        <div class="hidden lg:flex space-x-10 text-[10px] font-bold uppercase tracking-widest">
            <button onclick="navigateTo('home')" class="text-[#1d3557] hover:text-[#7fb3e6]">Home</button>
            <button onclick="navigateTo('events')" class="text-[#1d3557] hover:text-[#7fb3e6]">Events</button>
            <button onclick="navigateTo('reviews')" class="text-[#1d3557] hover:text-[#7fb3e6]">Reviews</button>
            <button onclick="navigateTo('contact')" class="text-[#7fb3e6]">Connect</button>
        </div>
        <button class="lg:hidden text-[#1d3557]" onclick="toggleMobileMenu()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16m-7 6h7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <div id="mobile-menu" class="hidden absolute top-20 left-0 w-full bg-white border-b border-gray-100 p-6 flex flex-col space-y-4 lg:hidden shadow-lg">
            <button onclick="navigateTo('home')" class="text-left font-bold text-xs uppercase">Home</button>
            <button onclick="navigateTo('events')" class="text-left font-bold text-xs uppercase">Events</button>
            <button onclick="navigateTo('reviews')" class="text-left font-bold text-xs uppercase">Reviews</button>
            <button onclick="navigateTo('contact')" class="text-left font-bold text-xs uppercase text-[#7fb3e6]">Connect</button>
        </div>
    </nav>

    <main id="app-content" class="pt-20 min-h-screen"></main>

    <script>
        const views = {
            home: () => `
                <section class="starry-bg text-white py-28 md:py-48 px-6 text-center relative overflow-hidden view-transition">
                    <div id="home-stars"></div>
                    <div class="relative z-10 max-w-5xl mx-auto">
                        <span class="inline-block px-5 py-1.5 border border-white/20 rounded-full text-[10px] font-bold tracking-[0.4em] mb-10 uppercase bg-white/5">Youth Led NGO</span>
                        <h1 class="text-6xl md:text-9xl font-extrabold mb-10 leading-[0.9] tracking-tighter uppercase">Small Acts, <br><span class="text-[#7fb3e6]">Big Smiles.</span></h1>
                        <p class="text-xl md:text-2xl text-blue-100 font-light max-w-3xl mx-auto mb-14 leading-relaxed">Team Nova is a youth led NGO dedicated to spreading happiness through workshops and community action.</p>
                    </div>
                </section>
                <section class="py-32 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                    <div class="img-container aspect-square"><img src="assets/images/about.jpeg" alt="Our Aim"></div>
                    <div>
                        <h2 class="text-5xl font-extrabold text-[#1d3557] mb-8 uppercase tracking-tighter italic">OUR AIM</h2>
                        <p class="text-gray-600 text-xl font-light mb-10 leading-relaxed">Team Nova is a non-profit NGO led by youth with the simple goal of spreading happiness to the less fortunate, even in the smallest of ways.</p>
                        <div class="bg-blue-50/50 p-10 rounded-[3rem] border-l-[12px] border-[#7fb3e6] shadow-sm">
                            <h3 class="slogan-font text-5xl text-[#1d3557] leading-snug">"to bring smiles, beyond social, religious and economic barriers"</h3>
                        </div>
                    </div>
                </section>
            `,
            reviews: () => `
                <div class="max-w-4xl mx-auto py-24 px-6 view-transition">
                    <h2 class="text-6xl font-black text-[#1d3557] mb-10 uppercase tracking-tighter italic text-center">REVIEWS</h2>
                    <div class="glass-card p-10 rounded-[3rem]">
                        <form onsubmit="event.preventDefault(); alert('Thank you for your time!'); navigateTo('home');">
                            <p class="font-bold text-center mb-2">Rate your experience:</p>
                            <div class="flex justify-center mb-6">
                                <div class="star-rating">
                                    <input type="radio" id="star5" name="rating" value="5"/><label for="star5">★</label>
                                    <input type="radio" id="star4" name="rating" value="4"/><label for="star4">★</label>
                                    <input type="radio" id="star3" name="rating" value="3"/><label for="star3">★</label>
                                    <input type="radio" id="star2" name="rating" value="2"/><label for="star2">★</label>
                                    <input type="radio" id="star1" name="rating" value="1"/><label for="star1">★</label>
                                </div>
                            </div>
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-bold mb-2">How did you find us?</label>
                                    <select class="w-full p-4 rounded-2xl border border-gray-200" required>
                                        <option value="">Select an option</option>
                                        <option>Social Media</option>
                                        <option>Friend/Family</option>
                                        <option>News/Press</option>
                                        <option>Event</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold mb-2">Your Comment</label>
                                    <textarea class="w-full p-4 rounded-2xl border border-gray-200 h-32" placeholder="Tell us about your experience..." required></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold mb-2">Add Pictures</label>
                                    <input type="file" class="w-full p-2" multiple accept="image/*">
                                </div>
                                <button type="submit" class="w-full bg-[#1d3557] text-white py-5 rounded-full font-black uppercase tracking-widest hover:bg-[#7fb3e6] transition-all">Submit Review</button>
                            </div>
                        </form>
                    </div>
                </div>
            `,
            contact: () => `
                <div class="max-w-3xl mx-auto py-32 text-center px-6 view-transition">
                    <h2 class="text-6xl font-black text-[#1d3557] mb-6 uppercase italic tracking-tighter">CONNECT</h2>
                    <p class="text-xl font-bold mb-10">teamnova.kolkata@gmail.com</p>
                    <div class="qr-frame mb-12"><img src="assets/images/about3.jpeg"></div>
                    <div class="flex flex-col md:flex-row gap-6 justify-center items-center">
                        <a href="mailto:teamnova.kolkata@gmail.com?subject=Proposal%20for%20Collaboration&body=Dear%20Team%20Nova,%0D%0AI%20hope%20this%20message%20finds%20you%20well.%20I%20am%20writing%20on%20behalf%20of%20[Your%20Organization/Name]%20to%20explore%20a%20potential%20collaboration..." 
                           class="bg-[#1d3557] text-white px-12 py-4 rounded-full font-black uppercase tracking-widest hover:scale-105 transition-all w-full md:w-auto">COLLAB</a>
                        <a href="mailto:teamnova.kolkata@gmail.com?subject=Request%20for%20Donation&body=Dear%20Team%20Nova,%0D%0AI%20hope%20this%20message%20finds%20you%20well.%20I%20am%20writing%20on%20behalf%20of%20[Your%20Organization/Name]%20to%20request%20a%20donation..." 
                           class="border-2 border-[#1d3557] text-[#1d3557] px-12 py-4 rounded-full font-black uppercase tracking-widest hover:bg-[#1d3557] hover:text-white transition-all w-full md:w-auto">DONATION</a>
                    </div>
                    <p class="mt-16 slogan-font text-4xl text-[#7fb3e6]">Love, nova.</p>
                </div>
            `
        };

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function navigateTo(viewName) {
            document.getElementById('app-content').innerHTML = views[viewName]();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('mobile-menu').classList.add('hidden');
            if(viewName === 'home') createStars('home-stars');
        }

        function createStars(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = (Math.random() * 2 + 1) + 'px';
                star.style.width = size; star.style.height = size;
                star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                container.appendChild(star);
            }
        }
        window.onload = () => navigateTo('home');
    </script>
</body>
</html>
