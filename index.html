<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --nova-navy: #1d3557; --nova-sky: #7fb3e6; --nova-white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--nova-white); color: var(--nova-navy); overflow-x: hidden; scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .slogan-font { font-family: 'Caveat', cursive; }
        .starry-bg { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); position: relative; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.3); } }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(29, 53, 87, 0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(29, 53, 87, 0.12); }
        .nav-link { position: relative; transition: color 0.3s ease; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: var(--nova-navy); transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
        .view-transition { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .img-container { border-radius: 2.5rem; overflow: hidden; box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15); background-color: #f8fafc; border: 1px solid rgba(0,0,0,0.05); }
        .img-container img { width: 100%; height: auto; display: block; object-fit: cover; }
        video { border-radius: 2rem; width: 100%; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .qr-container { max-width: 300px; margin: 0 auto; border: 10px solid white; border-radius: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
                <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-[#7fb3e6] shadow-sm bg-white">
                    <img src="assets/images/image_1dae43.jpg" alt="Logo" class="w-full h-full object-cover">
                </div>
                <span class="ml-3 font-black text-[#1d3557] italic tracking-tighter text-xl">Team NOVA</span>
            </div>
            <div class="hidden lg:flex items-center space-x-10">
                <button onclick="navigateTo('home')" class="nav-link text-[#1d3557]">Home</button>
                <button onclick="navigateTo('events')" class="nav-link text-[#1d3557]">Events</button>
                <button onclick="navigateTo('upcoming')" class="nav-link text-[#1d3557]">Upcoming</button>
                <button onclick="navigateTo('contact')" class="nav-link text-[#7fb3e6]">Connect</button>
            </div>
        </div>
    </nav>

    <main id="app-content" class="pt-20 min-h-screen"></main>

    <script>
        const views = {
            home: () => `
                <section class="starry-bg text-white py-28 text-center relative">
                    <div id="home-stars"></div>
                    <div class="relative z-10 max-w-5xl mx-auto">
                        <h1 class="text-6xl md:text-9xl font-extrabold mb-10 leading-[0.9] tracking-tighter">Small Acts, <br><span class="text-[#7fb3e6]">Big Smiles.</span></h1>
                        <p class="text-xl md:text-2xl text-blue-100 font-light max-w-3xl mx-auto mb-14">Team Nova is a youth led NGO dedicated to spreading happiness through workshops and community action.</p>
                    </div>
                </section>

                <section class="py-32 bg-slate-50 px-6">
                    <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                        <div>
                            <h2 class="text-5xl font-extrabold text-[#1d3557] mb-8 uppercase italic text-[#7fb3e6]">TEAM NOVA</h2>
                            <p class="text-gray-600 text-lg leading-relaxed mb-10 font-light">Through workshops, charity events, and community activities, we strive to bring support, hope, and joy to children and adults who struggle to make ends meet.</p>
                        </div>
                        <div class="img-container">
                            <img src="assets/images/image_1d9f7b.png" alt="Team Nova Action">
                        </div>
                    </div>
                </section>

                <section class="py-32 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                    <div class="img-container">
                        <img src="assets/images/image_1daed6.png" alt="Our Aim">
                    </div>
                    <div>
                        <h2 class="text-5xl font-extrabold text-[#1d3557] mb-8 uppercase italic">OUR AIM</h2>
                        <p class="text-gray-600 text-xl leading-relaxed mb-8 font-light">Team Nova is a non-profit NGO led by youth with the simple goal of spreading happiness to the less fortunate, even in the smallest of ways.</p>
                        <div class="bg-blue-50/50 p-10 rounded-[3rem] border-l-[12px] border-[#7fb3e6]">
                            <h3 class="slogan-font text-5xl text-[#1d3557]">"to bring smiles, beyond barriers"</h3>
                        </div>
                    </div>
                </section>
            `,
            'rotionwheels-detail': () => `
                <div class="view-transition pb-24">
                    <div class="bg-amber-50/50 py-24 px-6">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16">
                            <div class="md:w-1/2">
                                <h1 class="text-6xl md:text-8xl font-black text-[#1d3557] mb-8 italic uppercase tracking-tighter">ROTI ON <br><span class="text-amber-500">WHEELS</span></h1>
                                <p class="text-2xl text-gray-600 leading-relaxed font-light mb-10 italic">"Serving over 300 wholesome meals near Ballygunge Station"</p>
                            </div>
                            <div class="md:w-1/2"><video controls><source src="assets/videos/image_1d4ca4.png" type="video/mp4"></video></div>
                        </div>
                    </div>
                    <div class="max-w-6xl mx-auto py-24 px-6 text-xl text-gray-600 space-y-8 font-light">
                        <p>Today was a truly impactful day as we brought "Roti on Wheels" to the busy streets near Ballygunge Station. We served over 300 people a hot meal of fresh rotis, sabji, aachar, and gulab jamun.</p>
                        <p>While the food truck is an initiative of the Santosh Lalita Jain Foundation (SLJF), NGO Nova took the lead in sponsoring and facilitating the service for the day.</p>
                    </div>
                </div>
            `,
            'bookdrive-detail': () => `
                <div class="view-transition pb-24">
                    <div class="bg-blue-50/50 py-24 px-6">
                        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-12 items-center">
                            <div class="bg-black rounded-[2.5rem] overflow-hidden p-2 aspect-[9/16]">
                                <video controls><source src="assets/videos/image_1d9ebc.jpg" type="video/mp4"></video>
                            </div>
                            <div class="img-container aspect-[3/4]">
                                <img src="assets/images/image_1d9ebc.jpg" alt="Information poster" class="w-full h-full object-cover object-top">
                            </div>
                        </div>
                    </div>
                </div>
            `,
            'pickleball-detail': () => `
                <div class="view-transition pb-24">
                    <div class="bg-[#1d3557] py-24 px-6 text-white text-center">
                        <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter">PICKLEBALL <br><span class="text-[#7fb3e6]">SMASH HIT</span></h1>
                        <p class="text-2xl font-light italic mb-12">"Winners walked away with 10k!"</p>
                    </div>
                    <div class="max-w-7xl mx-auto py-24 px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <div class="img-container"><img src="assets/images/pickle8.jpeg" alt="Winners"></div>
                        <div class="img-container"><img src="assets/images/pickle9.jpeg" alt="Runners Up"></div>
                        <div class="img-container"><img src="assets/images/pickle10.jpeg" alt="Action Shot"></div>
                        <div class="img-container"><img src="assets/images/pickle11.jpeg" alt="Team Members"></div>
                        <div class="img-container"><img src="assets/images/pickle3.jpeg" alt="Court View"></div>
                        <div class="bg-black rounded-[2.5rem] overflow-hidden p-2 aspect-[9/16]">
                            <video controls><source src="assets/videos/pickle12.mp4" type="video/mp4"></video>
                        </div>
                    </div>
                </div>
            `,
            events: () => `<!-- Grid for main Events page -->`,
            upcoming: () => `<!-- Upcoming Events section -->`,
            contact: () => `<!-- Contact section with assets/images/about3.jpeg for QR -->`
        };

        function navigateTo(viewName) {
            document.getElementById('app-content').innerHTML = views[viewName]();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.onload = () => navigateTo('home');
    </script>
</body>
</html>
