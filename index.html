<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --nova-navy: #1d3557;
            --nova-sky: #7fb3e6;
            --nova-white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--nova-white);
            color: var(--nova-navy);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .slogan-font {
            font-family: 'Caveat', cursive;
        }

        .starry-bg {
            background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
            position: relative;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.3); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(29, 53, 87, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(29, 53, 87, 0.12);
        }

        .nav-link {
            position: relative;
            transition: color 0.3s ease;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: var(--nova-navy);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .view-transition {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .img-container {
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15);
            background-color: #f8fafc;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        video {
            border-radius: 2rem;
            width: 100%;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .qr-container {
            max-width: 300px;
            margin: 0 auto;
            border: 10px solid white;
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .locked-container {
            background: repeating-linear-gradient(
                45deg,
                #f8fafc,
                #f8fafc 10px,
                #f1f5f9 10px,
                #f1f5f9 20px
            );
        }
    </style>
</head>

                            <p class="text-gray-400 text-xl font-light leading-relaxed max-w-xl mx-auto italic mb-12">
                                Something spectacular is forming in the Nova constellation. We aren't ready to show you yet, but we promise it's worth the wait.
                            </p>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-lg mx-auto blur-[6px] select-none opacity-20">
                                <div class="bg-white p-6 rounded-3xl border border-gray-100">
                                    <p class="font-bold text-[#1d3557]">LOCATION: [CLASSIFIED]</p>
                                </div>
                                <div class="bg-white p-6 rounded-3xl border border-gray-100">
                                    <p class="font-bold text-[#1d3557]">DATE: XX/XX/2026</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="mt-12 text-xs font-bold text-gray-300 uppercase tracking-widest">Only the stars know the next move.</p>
                </div>
            `,
            contact: () => `
                <div class="max-w-3xl mx-auto py-32 px-6 text-center view-transition">
                    <div class="w-32 h-32 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-12 text-5xl animate-bounce">📱</div>
                    <h2 class="text-6xl font-black text-[#1d3557] mb-10 uppercase tracking-tighter italic leading-none uppercase">CONNECT</h2>
                    <p class="text-gray-500 text-xl mb-16 font-light leading-relaxed max-w-2xl mx-auto">For queries, complaints, or collaborations please dm. We are always looking for passionate youth to join us.</p>
                    
                    <div class="flex flex-col md:flex-row justify-center items-center gap-12 mb-16">
                        <div class="text-center">
                            <p class="text-xs font-black text-[#7fb3e6] uppercase tracking-widest mb-6 uppercase tracking-widest">SCAN TO FOLLOW</p>
                            <div class="qr-container">
                                <img src="assets/images/about3.jpg" alt="Instagram QR Code" class="w-full h-auto">
                            </div>
                        </div>
                        <div class="flex flex-col gap-4">
                            <a href="https://instagram.com/nova_.ngo" target="_blank" class="bg-[#1d3557] text-white px-12 py-5 rounded-full font-black text-xs uppercase tracking-widest shadow-2xl hover:scale-105 transition-all">
                                DM: @nova_.ngo
                            </a>
                            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest italic slogan-font text-lg">bringing smiles beyond barriers</p>
                        </div>
                    </div>
                </div>
            `
        };

        function navigateTo(viewName) {
            const content = document.getElementById('app-content');
            content.innerHTML = views[viewName]();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(viewName === 'home') createStars('home-stars');
            if(viewName === 'pickleball-detail') createStars('pickle-stars');
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function createStars(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = (Math.random() * 2 + 1) + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }

        window.onload = () => navigateTo('home');
    </script>
</body>
</html>
