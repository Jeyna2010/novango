<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Nova | Bringing Smiles Beyond Barriers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Plus+Jakarta+Sans:wght@700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --nova-navy: #1d3557; --nova-sky: #7fb3e6; --nova-white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--nova-white); color: var(--nova-navy); overflow-x: hidden; scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .slogan-font { font-family: 'Caveat', cursive; }
        
        .starry-bg { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); position: relative; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.3; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.3); } }

        /* Mechanical fix: Standardized shortened frames to hide bottom white space */
        .img-container { 
            border-radius: 2.5rem; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(29, 53, 87, 0.15); 
            background-color: #000; 
            aspect-ratio: 4 / 4.8; 
            display: flex; 
            align-items: flex-start; 
        }
        .img-container img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

        video { border-radius: 2rem; width: 100%; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(29, 53, 87, 0.1); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(29, 53, 87, 0.12); }

        /* Full Square QR Frame */
        .qr-frame { 
            max-width: 280px; 
            margin: 0 auto; 
            border: 10px solid white; 
            border-radius: 2.5rem; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
            aspect-ratio: 1 / 1; 
            overflow: hidden;
            background: white;
        }
        .qr-frame img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 h-20 flex items-center justify-between px-6">
        <div class="flex items-center cursor-pointer" onclick="navigateTo('home')">
            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-[#7fb3e6] shadow-sm bg-white">
                <img src="assets/images/logo.jpeg" alt="Logo" class="w-full h-full object-cover">
            </div>
            <span class="ml-3 font-black italic text-xl uppercase tracking-tighter">Team NOVA</span>
        </div>
        <div class="hidden lg:flex space-x-10 text-[10px] font-bold uppercase tracking-widest">
            <button onclick="navigateTo('home')" class="hover:text-[#7fb3e6] transition-colors">Home</button>
            <button onclick="navigateTo('events')" class="hover:text-[#7fb3e6] transition-colors">Events</button>
            <button onclick="navigateTo('upcoming')" class="hover:text-[#7fb3e6] transition-colors">Upcoming</button>
            <button onclick="navigateTo('contact')" class="text-[#7fb3e6] hover:opacity-70 transition-all">Connect</button>
        </div>
    </nav>

    <main id="app-content" class="pt-20 min-h-screen"></main>

    <script>
        const views = {
            home: () => `
                <section class="starry-bg text-white py-40 text-center px-6">
                    <div id="home-stars"></div>
                    <div class="relative z-10">
                        <span class="inline-block px-5 py-1.5 border border-white/20 rounded-full text-[10px] font-bold tracking-[0.4em] mb-10 uppercase bg-white/5">Youth Led NGO</span>
                        <h1 class="text-6xl md:text-9xl font-extrabold mb-10 leading-[0.9] tracking-tighter uppercase">Small Acts, <br><span class="text-[#7fb3e6]">Big Smiles.</span></h1>
                        <p class="text-xl md:text-2xl text-blue-100 font-light max-w-3xl mx-auto mb-14">Team Nova is a youth led NGO dedicated to spreading happiness to the less fortunate through workshops and community action.</p>
                        <div class="flex flex-col sm:flex-row gap-6 justify-center">
                            <button onclick="navigateTo('events')" class="bg-white text-[#1d3557] px-12 py-5 rounded-full font-black text-xs uppercase tracking-widest hover:bg-[#7fb3e6] transition-all transform hover:scale-105 shadow-2xl">Past Events</button>
                            <button onclick="navigateTo('contact')" class="border border-white/30 text-white px-12 py-5 rounded-full font-black text-xs uppercase tracking-widest hover:bg-white/10 transition-all backdrop-blur-sm">Connect With Us</button>
                        </div>
                    </div>
                </section>

                <section class="py-32 bg-slate-50 px-6">
                    <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                        <div class="order-2 md:order-1">
                            <h2 class="text-5xl font-extrabold mb-8 uppercase italic text-[#7fb3e6]">TEAM NOVA</h2>
                            <p class="text-gray-600 text-lg font-light leading-relaxed">Through workshops, charity events, and community activities, we strive to bring support, hope, and joy to children and adults who struggle to make ends meet.</p>
                        </div>
                        <div class="order-1 md:order-2 img-container">
                            <img src="assets/images/about2.jpeg">
                        </div>
                    </div>
                </section>

                <section class="py-32 px-6 max-w-7xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                    <div class="img-container">
                        <img src="assets/images/about.jpeg">
                    </div>
                    <div>
                        <h2 class="text-5xl font-extrabold text-[#1d3557] mb-8 uppercase italic">OUR AIM</h2>
                        <p class="text-gray-600 text-xl font-light mb-8">Team Nova is a non-profit NGO led by youth with the simple goal of spreading happiness to the less fortunate, even in the smallest of ways.</p>
                        <div class="bg-blue-50/50 p-10 rounded-[3rem] border-l-[12px] border-[#7fb3e6] shadow-sm">
                            <h3 class="slogan-font text-5xl leading-snug">"to bring smiles, beyond social, religious and economic barriers"</h3>
                        </div>
                    </div>
                </section>
            `,
            events: () => `
                <div class="max-w-7xl mx-auto py-24 px-6 text-center">
                    <h2 class="text-6xl font-extrabold mb-16 uppercase italic tracking-tighter">PAST EVENTS</h2>
                    <div class="grid md:grid-cols-3 gap-8">
                        <div class="glass-card rounded-[3rem] p-4 cursor-pointer" onclick="navigateTo('rotionwheels-detail')">
                             <div class="h-64 rounded-[2rem] overflow-hidden mb-6">
                                <video muted loop playsinline class="w-full h-full object-cover opacity-60"><source src="assets/videos/food1.mp4"></video>
                             </div>
                             <h3 class="text-2xl font-black uppercase">Roti on Wheels</h3>
                        </div>
                        <div class="glass-card rounded-[3rem] p-4 cursor-pointer" onclick="navigateTo('bookdrive-detail')">
                             <div class="h-64 rounded-[2rem] overflow-hidden mb-6">
                                <img src="assets/images/bookdrive1.jpeg" class="w-full h-full object-cover">
                             </div>
                             <h3 class="text-2xl font-black uppercase">The Book Drive</h3>
                        </div>
                        <div class="glass-card rounded-[3rem] p-4 cursor-pointer" onclick="navigateTo('pickleball-detail')">
                             <div class="h-64 rounded-[2rem] overflow-hidden mb-6">
                                <img src="assets/images/pickle1.jpeg" class="w-full h-full object-cover">
                             </div>
                             <h3 class="text-2xl font-black uppercase">Pickleball Fundraiser</h3>
                        </div>
                    </div>
                </div>
            `,
            'rotionwheels-detail': () => `
                <div class="pb-24">
                    <div class="bg-amber-50/50 py-24 px-6">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16">
                            <div class="md:w-1/2">
                                <h1 class="text-6xl md:text-8xl font-black text-[#1d3557] mb-8 italic uppercase tracking-tighter">ROTI ON <br><span class="text-amber-500">WHEELS</span></h1>
                                <p class="text-2xl text-gray-600 font-light italic leading-relaxed mb-10">"Serving over 300 wholesome meals near Ballygunge Station"</p>
                            </div>
                            <div class="md:w-1/2">
                                <video controls><source src="assets/videos/food1.mp4" type="video/mp4"></video>
                            </div>
                        </div>
                    </div>
                    <div class="max-w-6xl mx-auto py-24 px-6 text-xl text-gray-600 font-light leading-relaxed space-y-8">
                        <p>Today was a truly impactful day as we brought "Roti on Wheels" to the busy streets near Ballygunge Station. We were able to serve over 300 people a wholesome, hot meal consisting of fresh rotis, nutritious sabji, tangy aachar, and a sweet treat of gulab jamun.</p>
                        <p>This event was a collaboration between NGO Nova and the Santosh Lalita Jain Foundation (SLJF). While the specialized mobile food truck is an initiative of the SLJF, NGO Nova took the lead in sponsoring and facilitating the entire food service for the day.</p>
                        <p>We extend a heartfelt thank you to the SLJ Foundation for their incredible partnership and for the use of their innovative mobile kitchen unit.</p>
                        <div class="slogan-font text-5xl text-[#7fb3e6] text-center mt-12">Love, nova.</div>
                    </div>
                </div>
            `,
            'bookdrive-detail': () => `
                <div class="pb-24">
                    <div class="bg-blue-50/50 py-24 px-6">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16">
                            <div class="md:w-1/2 flex items-center justify-center p-4">
                                <div class="bg-black rounded-[2.5rem] overflow-hidden p-1 shadow-2xl w-full">
                                    <video controls><source src="assets/videos/bookdrive3.mp4"></video>
                                </div>
                            </div>
                            <div class="md:w-1/2 flex items-center justify-center p-4">
                                <div class="img-container w-full max-w-md">
                                    <img src="assets/images/bookdrive2.jpeg">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="max-w-4xl mx-auto py-24 px-6 text-xl text-gray-600 font-light leading-relaxed space-y-8">
                        <p>There's something so special about books... Sadly, not every child gets the chance to experience that joy. That's why Team Nova hosted our very first Book Drive from 29th Sept to 1st Oct 2025.</p>
                        <p>Grateful for every book and helping hand! Thank you CINI (Child in Need Institute) for letting us be a part of such a wonderful experience.</p>
                        <div class="slogan-font text-5xl text-[#7fb3e6] text-center mt-12">Love, nova.</div>
                    </div>
                </div>
            `,
            'pickleball-detail': () => `
                <div class="pb-24">
                    <div class="bg-[#1d3557] py-24 px-6 text-white text-center relative overflow-hidden">
                        <div id="pickle-stars"></div>
                        <h1 class="text-6xl md:text-8xl font-black mb-8 italic uppercase tracking-tighter relative z-10">PICKLEBALL <br><span class="text-[#7fb3e6]">SMASH HIT</span></h1>
                        <p class="text-2xl text-blue-100 font-light italic mb-10 relative z-10">Bringing smiles without any barriers.</p>
                        <div class="bg-white/10 backdrop-blur p-8 inline-block rounded-[2.5rem] border border-white/10 relative z-10">
                            <p class="font-bold text-xl uppercase">WINNERS WALKED AWAY WITH 10K</p>
                        </div>
                    </div>
                    <div class="max-w-7xl mx-auto py-24 px-6">
                        <div class="max-w-3xl mx-auto text-center mb-24 space-y-8 text-2xl text-gray-600 font-light leading-relaxed">
                            <p>Ngo nova had its first fundraiser! A pickleball smash hit fundraiser with all proceeds going to funding our future drives, bringing a smile to faces without any barriers.</p>
                            <p>The winners walked away with 10k and an amazing experience. Each match was a war of talent, entertaining and nerve wracking to watch! This wouldn't have been possible without you so thank you and more coming soon!</p>
                            <div class="slogan-font text-5xl text-[#7fb3e6] mt-12">Love, nova.</div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            <div class="img-container"><img src="assets/images/pickle8.jpeg"></div>
                            <div class="img-container"><img src="assets/images/pickle9.jpeg"></div>
                            <div class="img-container"><img src="assets/images/pickle10.jpeg"></div>
                            <div class="img-container"><img src="assets/images/pickle11.jpeg"></div>
                            <div class="img-container"><img src="assets/images/pickle3.jpeg"></div>
                            <div class="bg-black rounded-[2.5rem] overflow-hidden p-2 aspect-[9/16]">
                                <video controls><source src="assets/videos/pickle12.mp4" type="video/mp4"></video>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            upcoming: () => `
                <div class="max-w-4xl mx-auto py-32 px-6 text-center">
                    <div class="p-24 rounded-[4rem] border-4 border-dashed border-gray-200 relative overflow-hidden">
                        <h2 class="text-6xl md:text-8xl font-black mb-6 italic uppercase tracking-widest">TOP SECRET</h2>
                        <p class="text-gray-400 text-xl font-light italic slogan-font text-3xl">Something spectacular is forming in the Nova constellation.</p>
                    </div>
                </div>
            `,
            contact: () => `
                <div class="max-w-3xl mx-auto py-32 text-center px-6">
                    <h2 class="text-6xl font-black mb-12 uppercase italic tracking-tighter">CONNECT</h2>
                    <div class="qr-frame"><img src="assets/images/about3.jpeg"></div>
                    <div class="mt-12 space-y-6">
                        <p class="text-gray-500 font-light italic text-lg max-w-md mx-auto leading-relaxed">For complaints, queries or collaborations, please message us at our Instagram handle:</p>
                        <a href="https://instagram.com/nova_.ngo" target="_blank" class="inline-block bg-[#1d3557] text-[#7fb3e6] px-12 py-4 rounded-full font-black text-xl shadow-xl hover:scale-105 transition-all">@nova_.ngo</a>
                    </div>
                    <p class="mt-16 slogan-font text-4xl text-[#7fb3e6]">Love, nova.</p>
                </div>
            `
        };

        function navigateTo(viewName) {
            const content = document.getElementById('app-content');
            content.innerHTML = views[viewName]();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(viewName === 'home') createStars('home-stars');
            if(viewName === 'pickleball-detail') createStars('pickle-stars');
        }

        function createStars(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = (Math.random() * 2 + 1) + 'px';
                star.style.width = size; star.style.height = size;
                star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                container.appendChild(star);
            }
        }
        window.onload = () => navigateTo('home');
    </script>
</body>
</html>
